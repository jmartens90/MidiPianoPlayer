name: android-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Qt for Android (and the matching desktop Qt for the host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      - name: Install Android NDK r26b (the version Qt 6.8 is built with)
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
      - name: Build APK
        run: cmake --build build-android --target apk
      - name: Collect APK
        run: |
          find build-android -name "*.apk" -print
          cp "$(find build-android -name '*debug*.apk' | head -1)" MidiPianoPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MidiPianoPlayer-android-arm64
          path: MidiPianoPlayer.apk
